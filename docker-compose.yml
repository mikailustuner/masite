name: evidera

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evidera
      POSTGRES_PASSWORD: evidera_dev_password
      POSTGRES_DB: evidera
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - evidera_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidera -d evidera"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - evidera_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evidera
      MINIO_ROOT_PASSWORD: evidera_dev_storage_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - evidera_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  create-evidence-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 evidera evidera_dev_storage_password &&
      mc mb --ignore-existing local/evidera-evidence &&
      mc anonymous set none local/evidera-evidence
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
      PUBLIC_APP_URL: http://localhost:4173
      TRUST_PROXY: "true"
      LOG_LEVEL: info
      DATABASE_URL: postgres://evidera:evidera_dev_password@postgres:5432/evidera
      DATABASE_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: evidera
      SESSION_COOKIE_NAME: evidera_session
      SESSION_SECRET: local-compose-session-secret-32-bytes-minimum
      SESSION_TTL_HOURS: 168
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: evidera-evidence
      S3_ACCESS_KEY: evidera
      S3_SECRET_KEY: evidera_dev_storage_password
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: none
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      create-evidence-bucket: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://evidera:evidera_dev_password@postgres:5432/evidera
      DATABASE_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: evidera
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: evidera-evidence
      S3_ACCESS_KEY: evidera
      S3_SECRET_KEY: evidera_dev_storage_password
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: none
      CRAWLER_USER_AGENT: EvideraAuditBot/1.0 (+https://your-domain.example/bot)
      CRAWLER_CONTACT_URL: https://your-domain.example/bot
      CRAWLER_TIMEOUT_MS: 15000
      CRAWLER_MAX_RESPONSE_BYTES: 2097152
      CRAWLER_DEFAULT_DELAY_MS: 1000
      CRAWLER_ALLOWED_PORTS: 80,443
      SERP_PROVIDER: disabled
      BACKLINK_PROVIDER: disabled
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      create-evidence-bucket: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - api

volumes:
  evidera_postgres:
  evidera_redis:
  evidera_minio:
