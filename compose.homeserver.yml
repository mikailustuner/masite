name: evidera-homeserver

x-api-image: &api_image
  image: evidera-api:homeserver
  build:
    context: .
    dockerfile: apps/api/Dockerfile

x-api-environment: &api_environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 4100
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
  TRUST_PROXY: "true"
  COOKIE_SECURE: "false"
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  DATABASE_URL: postgres://evidera_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/evidera
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  QUEUE_PREFIX: evidera-home
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: evidera-evidence
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_FORCE_PATH_STYLE: "true"
  S3_SERVER_SIDE_ENCRYPTION: none

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidera_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: evidera
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    volumes:
      - postgres_home_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidera_admin -d evidera"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redis_home_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes: [evidence_home_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing local/evidera-evidence && mc anonymous set none local/evidera-evidence"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    networks: [backend]

  migrate:
    <<: *api_image
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://evidera_admin:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/evidera
      MIGRATIONS_FOLDER: /app/infra/postgres/migrations
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  bootstrap:
    <<: *api_image
    command: ["node", "apps/api/dist/bootstrap.js"]
    environment:
      DATABASE_URL: postgres://evidera_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/evidera
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:?BOOTSTRAP_ORGANIZATION_NAME is required}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]

  api:
    <<: *api_image
    restart: unless-stopped
    environment: *api_environment
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      create-bucket: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  worker:
    image: evidera-worker:homeserver
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api_environment
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:?CRAWLER_USER_AGENT is required}
      CRAWLER_CONTACT_URL: ${CRAWLER_CONTACT_URL:?CRAWLER_CONTACT_URL is required}
      CRAWLER_TIMEOUT_MS: 15000
      CRAWLER_MAX_RESPONSE_BYTES: 2097152
      CRAWLER_DEFAULT_DELAY_MS: 1000
      CRAWLER_ALLOWED_PORTS: 80,443
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      RENDER_TIMEOUT_MS: 30000
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      CRUX_API_BASE_URL: ${CRUX_API_BASE_URL:-https://chromeuxreport.googleapis.com/v1/records:queryRecord}
      SERP_PROVIDER: ${SERP_PROVIDER:-disabled}
      SERP_API_BASE_URL: ${SERP_API_BASE_URL:-}
      SERP_API_KEY: ${SERP_API_KEY:-}
      SERP_DAILY_QUERY_LIMIT: ${SERP_DAILY_QUERY_LIMIT:-50}
      BACKLINK_PROVIDER: ${BACKLINK_PROVIDER:-disabled}
      BACKLINK_API_BASE_URL: ${BACKLINK_API_BASE_URL:-}
      BACKLINK_API_KEY: ${BACKLINK_API_KEY:-}
      OPENPAGERANK_API_BASE_URL: ${OPENPAGERANK_API_BASE_URL:-https://openpagerank.keywordseverywhere.com/}
      OPENPAGERANK_API_KEY: ${OPENPAGERANK_API_KEY:-}
      ALLOW_UNENCRYPTED_EVIDENCE: "true"
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      create-bucket: { condition: service_completed_successfully }
    networks: [backend]

  web:
    image: evidera-web:homeserver
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${EVIDERA_BIND_IP:?EVIDERA_BIND_IP is required}:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

networks:
  backend: {}

volumes:
  postgres_home_data: {}
  redis_home_data: {}
  evidence_home_data: {}
