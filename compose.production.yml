name: evidera-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidera_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: evidera
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?set APP_DATABASE_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data, ./infra/postgres/init:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U evidera_admin -d evidera"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"], interval: 5s, timeout: 3s, retries: 20 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}" }
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [evidence_data:/data]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [backend]

  create-bucket:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing local/evidera-evidence && mc anonymous set none local/evidera-evidence"]
    environment: { S3_ACCESS_KEY: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY}", S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY}" }
    networks: [backend]

  migrate:
    image: ${EVIDERA_API_IMAGE:-evidera-api:latest}
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://evidera_admin:${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}@postgres:5432/evidera
      MIGRATIONS_FOLDER: /app/infra/postgres/migrations
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]

  api:
    image: ${EVIDERA_API_IMAGE:-evidera-api:latest}
    restart: unless-stopped
    environment: &api_environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      DATABASE_URL: postgres://evidera_app:${APP_DATABASE_PASSWORD:?set APP_DATABASE_PASSWORD}@postgres:5432/evidera
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: evidera-evidence
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_SERVER_SIDE_ENCRYPTION: AES256
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, create-bucket: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [backend]

  worker:
    image: ${EVIDERA_WORKER_IMAGE:-evidera-worker:latest}
    restart: unless-stopped
    environment:
      <<: *api_environment
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:?set CRAWLER_USER_AGENT}
      CRAWLER_CONTACT_URL: ${CRAWLER_CONTACT_URL:?set CRAWLER_CONTACT_URL}
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      CRUX_API_BASE_URL: ${CRUX_API_BASE_URL:-https://chromeuxreport.googleapis.com/v1/records:queryRecord}
      SERP_PROVIDER: ${SERP_PROVIDER:-disabled}
      SERP_API_BASE_URL: ${SERP_API_BASE_URL:-}
      SERP_API_KEY: ${SERP_API_KEY:-}
      SERP_DAILY_QUERY_LIMIT: ${SERP_DAILY_QUERY_LIMIT:-50}
      BACKLINK_PROVIDER: ${BACKLINK_PROVIDER:-disabled}
      BACKLINK_API_BASE_URL: ${BACKLINK_API_BASE_URL:-}
      BACKLINK_API_KEY: ${BACKLINK_API_KEY:-}
      OPENPAGERANK_API_BASE_URL: ${OPENPAGERANK_API_BASE_URL:-https://openpagerank.keywordseverywhere.com/}
      OPENPAGERANK_API_KEY: ${OPENPAGERANK_API_KEY:-}
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, create-bucket: { condition: service_completed_successfully } }
    networks: [backend]

  web:
    image: ${EVIDERA_WEB_IMAGE:-evidera-web:latest}
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: { api: { condition: service_healthy } }
    networks: [backend]

networks: { backend: {} }
volumes: { postgres_data: {}, redis_data: {}, evidence_data: {} }
